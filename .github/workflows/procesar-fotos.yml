name: Procesar fotos
on:
  push:
    paths: ["pedidos/**.csv"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: procesar-fotos
  cancel-in-progress: false
jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy opencv-python-headless requests "rembg[cpu]"
      - run: python scripts/procesar.py
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fotos procesadas automáticamente"
          git push
