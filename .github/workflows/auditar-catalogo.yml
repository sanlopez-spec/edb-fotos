name: Auditar catalogo
on:
  workflow_dispatch:
  push:
    paths: ["scripts/auditar.py"]
permissions:
  contents: write
concurrency:
  group: procesar-fotos
  cancel-in-progress: false
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy requests
      - run: python scripts/auditar.py
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auditoría del catálogo"
          git pull --rebase -q
          git push
