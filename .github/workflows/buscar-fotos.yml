name: Buscar fotos
on:
  workflow_dispatch:
  push:
    paths: ["busquedas/*.csv", "scripts/buscar.py"]
permissions:
  contents: write
concurrency:
  group: procesar-fotos
  cancel-in-progress: false
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - run: python scripts/buscar.py
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Candidatos de fotos"
          git push
